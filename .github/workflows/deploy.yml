name: Build and Test Spring Boot Application

on:
  push:
    branches:
      - develop  # Triggers when code is pushed to the 'main' branch
  pull_request:
    branches:
      - develop  # Trigger on PR to main branch

jobs:
  build:
    runs-on: ubuntu-latest  # You can use macOS or Windows if required

    services:
      # Start Docker services for Testcontainers, for example, PostgreSQL or any other DB service needed for integration tests
      postgres:
        image: postgres:15
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ppp
          POSTGRES_DB: testdb
        options: --health-cmd="pg_isready -U postgres" --health-interval=5s --health-timeout=5s --health-retries=3

    steps:
      # Checkout the code
      - name: Checkout code
        uses: actions/checkout@v3

      # Set up Java (using OpenJDK 17)
      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'  # OpenJDK distribution
          java-version: '21'       # Specify Java version (e.g., 11, 17)

      # Cache Maven dependencies
      - name: Cache Maven dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      # Build the project with Maven
      - name: Build with Maven
        run: mvn clean install --no-transfer-progress

      # Optionally, run tests
      - name: Run integration tests with Testcontainers
        run: mvn verify -DskipTests=false

      # Package the Spring Boot application
      - name: Package Spring Boot JAR
        run: mvn package

      # Optionally, upload the JAR to GitHub Releases (uncomment if needed)
      # - name: Upload JAR as GitHub Release
      #   uses: softprops/action-gh-release@v1
      #   with:
      #     files: target/*.jar
